name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@6eb3ef76e48ad5aca2d217e4ee277786b3865699
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Type check
        run: vp run check

      - name: Lint
        run: vp run lint

      - name: Check formatting
        run: vp run format:check

      - name: Test
        run: vp run test

      - name: Build
        run: vp run build

      - name: Check package and report footprint
        run: vp run release:check -- --report package-footprint.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Benchmark explain query overhead
        run: node scripts/benchmark-explain.mjs --runs 15

  runtime:
    name: Node.js ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.x", "26.x"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - uses: voidzero-dev/setup-vp@6eb3ef76e48ad5aca2d217e4ee277786b3865699
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp run build

      - name: Smoke test CLI with Node.js
        run: node dist/cli/main.js src/index.ts --json

      - name: Verify CommonJS extraction with Node.js
        run: node --input-type=module -e "import { analyze } from './dist/index.js'; const { graph } = await analyze('test/fixtures/basic-esm/src/legacy.cjs'); if (!graph.edges.some((edge) => edge.kind === 'require' && edge.specifier === './lib/legacy.cjs')) process.exit(1);"
