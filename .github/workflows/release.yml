name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@6eb3ef76e48ad5aca2d217e4ee277786b3865699
        with:
          cache: true

      - name: Verify tag format and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unsupported release tag: $tag" >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "release tag $tag does not point to a commit on origin/main" >&2
            exit 1
          fi

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Type check
        run: vp run check

      - name: Lint
        run: vp run lint

      - name: Check formatting
        run: vp run format:check

      - name: Test
        run: vp run test

      - name: Build
        run: vp run build

      - name: Check package and report footprint
        run: vp run release:check -- --output release-package --report package-footprint.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Verify package version matches tag
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync("package.json", "utf8")).version)')"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "package.json version $package_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          if-no-files-found: error
          path: |
            release-package/*.tgz
            package-footprint.json

  stage:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: .

      - name: Stage npm publish with OIDC
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(release-package/*.tgz)
          if (( ${#tarballs[@]} != 1 )); then
            echo "expected exactly one release tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          npm stage publish "./${tarballs[0]}" --provenance --access public
