name: Module Set Diagnostics

on:
  push:
    branches:
      - ci/explain-benchmark-module-sets

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HONO_REPOSITORY: https://github.com/honojs/hono.git
      HONO_COMMIT: 098e11912ab244c5c33931de007f04dc8e3c2929
      WEBPACK_REPOSITORY: https://github.com/webpack/webpack.git
      WEBPACK_COMMIT: e9e02fb312a904c04e151ebd08aaa03364a31513
      MADGE_VERSION: 8.0.0
      DPDM_VERSION: 4.3.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Prepare fixed corpora
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/oxdg-module-diagnostics"
          hono_dir="$workspace/hono"
          webpack_dir="$workspace/webpack"
          mkdir -p "$workspace"

          git init -q "$hono_dir"
          git -C "$hono_dir" remote add origin "$HONO_REPOSITORY"
          git -C "$hono_dir" fetch --depth 1 origin "$HONO_COMMIT"
          git -C "$hono_dir" checkout --detach "$HONO_COMMIT"

          git init -q "$webpack_dir"
          git -C "$webpack_dir" remote add origin "$WEBPACK_REPOSITORY"
          git -C "$webpack_dir" fetch --depth 1 origin "$WEBPACK_COMMIT"
          git -C "$webpack_dir" checkout --detach "$WEBPACK_COMMIT"

          {
            echo "BENCHMARK_WORKSPACE=$workspace"
            echo "HONO_DIR=$hono_dir"
            echo "WEBPACK_DIR=$webpack_dir"
          } >> "$GITHUB_ENV"
      - name: Pack current main
        run: node scripts/package-footprint.mjs --output "$BENCHMARK_WORKSPACE/packs/oxdg" --report benchmark-package-footprint.json
      - name: Install benchmark packages
        run: node scripts/benchmark-packages.mjs --workspace "$BENCHMARK_WORKSPACE" --locks benchmark-package-locks --package-footprint benchmark-package-footprint.json --release-footprint benchmark-release-footprint.json
      - name: Compare graph module sets
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/module-diff.mjs" <<'NODE'
          import { execFile } from "node:child_process";
          import { mkdtemp, readFile, readdir, rm } from "node:fs/promises";
          import { extname, isAbsolute, join, relative, resolve } from "node:path";
          import { promisify } from "node:util";
          import { createRequire } from "node:module";

          const exec = promisify(execFile);
          const require = createRequire(import.meta.url);
          const workspace = process.env.BENCHMARK_WORKSPACE;
          const extensions = ["js","jsx","ts","tsx","mjs","cjs","mts","cts"];
          const extensionSet = new Set(extensions.map((x) => "." + x));
          const releaseCli = join(workspace, "consumers/release/node_modules/.bin/oxdg");
          const mainCli = join(workspace, "consumers/main/node_modules/.bin/oxdg");
          const dpdmCli = join(workspace, "consumers/dpdm/node_modules/.bin/dpdm");
          const madgeDir = join(workspace, "consumers/madge/node_modules/madge");
          const madge = require(madgeDir);

          const norm = (root, value) => {
            let p = String(value).replaceAll("\\", "/");
            if (isAbsolute(p)) p = relative(root, p).replaceAll("\\", "/");
            while (p.startsWith("./")) p = p.slice(2);
            return p;
          };

          async function listSourceFiles(root, dir) {
            const out = [];
            async function walk(abs) {
              for (const entry of await readdir(abs, { withFileTypes: true })) {
                const p = join(abs, entry.name);
                if (entry.isDirectory()) await walk(p);
                else if (entry.isFile() && extensionSet.has(extname(entry.name))) out.push(norm(root, p));
              }
            }
            await walk(join(root, dir));
            return new Set(out.sort());
          }

          async function oxdgSet(cli, cwd, input) {
            const { stdout } = await exec(cli, ["--extensions", extensions.join(","), input, "--json"], { cwd, maxBuffer: 50 * 1024 * 1024 });
            const json = JSON.parse(stdout);
            return new Set(json.modules.map((m) => norm(cwd, m.id)));
          }

          async function dpdmSet(cwd, input) {
            const temp = await mkdtemp(join(process.env.RUNNER_TEMP, "dpdm-set-"));
            const output = join(temp, "graph.json");
            try {
              await exec(dpdmCli, ["--extensions", extensions.join(","), input, "--output", output, "--no-tree", "--no-circular", "--no-warning"], { cwd, maxBuffer: 50 * 1024 * 1024 });
              const json = JSON.parse(await readFile(output, "utf8"));
              return new Set(Object.entries(json.tree).filter(([, deps]) => deps !== null).map(([p]) => norm(cwd, p)));
            } finally {
              await rm(temp, { recursive: true, force: true });
            }
          }

          async function madgeSet(cwd, input) {
            const res = await madge(resolve(cwd, input), { fileExtensions: extensions, baseDir: cwd });
            return new Set(Object.keys(res.obj()).map((p) => norm(cwd, p)));
          }

          const sorted = (s) => [...s].sort();
          const subtract = (a, b) => new Set([...a].filter((x) => !b.has(x)));
          const summarize = (name, set, corpus, baseline) => ({
            name,
            count: set.size,
            insideInput: [...set].filter((x) => corpus.has(x)).length,
            outsideInput: sorted(subtract(set, corpus)),
            missingInput: sorted(subtract(corpus, set)),
            onlyVsOxdg: baseline ? sorted(subtract(set, baseline)) : [],
            missingVsOxdg: baseline ? sorted(subtract(baseline, set)) : [],
          });

          async function runCorpus(label, cwd, directory, entrypoint) {
            const corpus = await listSourceFiles(cwd, directory);
            const workloads = [
              ["directory", directory, `${directory}/**/*.{${extensions.join(",")}}`],
              ["entrypoint", entrypoint, entrypoint],
            ];
            const report = { label, corpusFiles: corpus.size, workloads: {} };
            for (const [kind, toolInput, dpdmInput] of workloads) {
              const release = await oxdgSet(releaseCli, cwd, toolInput);
              const main = await oxdgSet(mainCli, cwd, toolInput);
              const dpdm = await dpdmSet(cwd, dpdmInput);
              const madgeGraph = await madgeSet(cwd, toolInput);
              report.workloads[kind] = {
                release: summarize("oxdg-release", release, corpus),
                main: summarize("oxdg-main", main, corpus, release),
                dpdm: summarize("dpdm", dpdm, corpus, release),
                madge: summarize("Madge", madgeGraph, corpus, release),
              };
            }
            return report;
          }

          const report = {
            hono: await runCorpus("Hono", process.env.HONO_DIR, "src", "src/index.ts"),
            webpack: await runCorpus("Webpack", process.env.WEBPACK_DIR, "lib", "lib/index.js"),
          };
          console.log(JSON.stringify(report, null, 2));
          NODE

          node "$RUNNER_TEMP/module-diff.mjs"
